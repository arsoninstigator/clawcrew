# the clawcrew services. everything here is ours; the tools it plugs into are yours.
#
#   docker compose up -d                      api + redis + worker + beat
#   docker compose --profile workflows up -d  ... plus a self-hosted n8n on :5678
#
# worker and beat are the cluster path: the beat fires the tick every 15s (enqueueing due
# schedules) and the nightly event at 02:00 UTC, and the worker drains what it enqueues.
# both are the broker's own binary, which is why the image installs the `schedule` extra
# and why the command names it: a binary cannot be renamed. `CLAWCREW_BROKER=inproc` needs
# neither container and no package at all, which is what the tests use.
#
# dify is not defined here on purpose: it is a stack (api, worker, web, postgres,
# redis, vector store), not one container. run their docker/docker-compose.yaml,
# then point CLAWCREW_DIFY_BASE_URL at it. see SELF_HOSTING.md.
#
# persistent's runtime boots local microVMs, so it belongs on the host with /dev/kvm,
# not inside this compose file: pip install persistent && persistent setup.

services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    volumes: ["clawcrew-data:/data"]
    depends_on: [redis]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    restart: unless-stopped

  # executes queued work: task dispatches, workflow runs, trigger actions
  worker:
    build: .
    env_file: [.env]
    volumes: ["clawcrew-data:/data"]
    command: ["celery", "-A", "ingredients.schedule.jobs", "worker", "-Q", "clawcrew", "--loglevel=info", "--concurrency=2"]
    depends_on: [redis]
    restart: unless-stopped
    # to run persistent computers from this container instead of the host:
    #   build arg INSTALL_PERSISTENT=true, plus:
    # devices: ["/dev/kvm:/dev/kvm"]

  # the clock: tick every 15s, nightly at 02:00 UTC
  beat:
    build: .
    env_file: [.env]
    volumes: ["clawcrew-data:/data"]
    command: ["celery", "-A", "ingredients.schedule.jobs", "beat", "--loglevel=info"]
    depends_on: [redis]
    restart: unless-stopped

  # optional: your own n8n, for the `n8n` workflow node
  n8n:
    profiles: ["workflows"]
    image: docker.n8n.io/n8nio/n8n:latest
    ports: ["5678:5678"]
    environment:
      - N8N_SECURE_COOKIE=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - GENERIC_TIMEZONE=UTC
    volumes: ["n8n-data:/home/node/.n8n"]
    restart: unless-stopped

volumes:
  clawcrew-data:
  redis-data:
  n8n-data:
