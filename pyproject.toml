[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clawcrew"
version = "0.1.0"
description = "agent crews with persistent computers, reviewable a2a, and visual workflows"
requires-python = ">=3.11"
# the vendored clients (clawcrew/vendor) import attrs, httpx, python-dateutil and
# pydantic v2, so those are runtime dependencies, not dev extras. a clean-machine
# build caught dateutil missing here; it is declared now.
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "attrs>=23.2",
    "python-dateutil>=2.8",
    "pydantic>=2.5",
]

[project.optional-dependencies]
# e2b command execution goes over envd, which is the e2b sdk's job, not the REST api's
e2b = ["e2b>=2.0"]
celery = ["celery>=5.3"]
dify-yaml = ["pyyaml>=6.0"]
dev = ["httpx>=0.27"]

[project.scripts]
clawcrew = "clawcrew.cli:main"

[tool.setuptools.packages.find]
include = ["clawcrew*"]

[tool.setuptools.package-data]
clawcrew = ["vendor/*/LICENSE", "vendor/*/PROVENANCE.md", "vendor/README.md"]
