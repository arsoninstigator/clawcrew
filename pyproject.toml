[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clawcrew"
version = "0.1.0"
description = "agent crews with persistent computers, reviewable a2a, and visual workflows"
requires-python = ">=3.11"
# the vendored clients (clawcrew/vendor) import attrs, httpx, python-dateutil and
# pydantic v2, so those are runtime dependencies, not dev extras. a clean-machine
# build caught dateutil missing here; it is declared now.
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "attrs>=23.2",
    "python-dateutil>=2.8",
    "pydantic>=2.5",
    # schedule is not optional: overnight runs, the tick beat and every trigger that
    # queues work go through it. `CLAWCREW_BROKER=inproc` is the dev/test path.
    "schedule>=5.3",
]

[project.optional-dependencies]
# command execution inside an ephemeral sandbox goes over envd, which only the upstream
# python sdk implements, so the requirement carries the upstream distribution name. it is
# the one identifier in the manifest that cannot be renamed; `clawcrew/thirdparty.md` says
# whose it is and why the hop is not reimplemented here.
ephemeral = ["e2b>=2.0"]
schedule = ["schedule>=5.3"]
dify-yaml = ["pyyaml>=6.0"]
dev = ["httpx>=0.27"]

[project.scripts]
clawcrew = "core.cli:main"

[tool.setuptools.packages.find]
include = ["core*", "api*", "agents*", "work*", "comms*", "org*", "manage*", "create*",
           "sandbox*", "ingredients*", "toolbox*", "workbench*", "infrastructure*", "vendor*"]

[tool.setuptools.package-data]
vendor = ["vendor/*/LICENSE", "vendor/*/PROVENANCE.md", "vendor/README.md"]
