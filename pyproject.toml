[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crittertown"
version = "0.1.0"
description = "agent crews with persistent computers, reviewable a2a, and visual workflows"
requires-python = ">=3.11"
# the vendored clients (vendor/) import attrs, httpx, python-dateutil and
# pydantic v2, so those are runtime dependencies, not dev extras. a clean-machine
# build caught dateutil missing here; it is declared now.
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "attrs>=23.2",
    "python-dateutil>=2.8",
    "pydantic>=2.5",
]

[project.optional-dependencies]
# command execution inside an ephemeral sandbox goes over envd, which only the upstream
# python sdk implements, so the requirement carries the upstream distribution name. it is
# the one identifier in the manifest that cannot be renamed; `crittertown/thirdparty.md` says
# whose it is and why the hop is not reimplemented here.
ephemeral = ["e2b>=2.0"]
# a cluster: `CRITTERTOWN_BROKER=schedule` moves job ids between processes over redis.
# the in-process broker is the default and needs nothing, so this is an extra, not a
# dependency. the requirement carries the broker's own distribution name, like ephemeral's.
schedule = ["celery[redis]>=5.3"]
dify-yaml = ["pyyaml>=6.0"]
# hosting the rows instead of the sqlite file: `CRITTERTOWN_DB_URL=postgresql://...`
# swaps in the postgres store. the binary wheel keeps the deploy a pip install.
postgres = ["psycopg[binary]>=3.1"]
dev = ["httpx>=0.27"]

[project.scripts]
crittertown = "core.cli:main"

[tool.setuptools.packages.find]
include = ["core*", "api*", "agents*", "work*", "comms*", "org*", "manage*", "create*",
           "sandbox*", "ingredients*", "toolbox*", "workbench*", "infrastructure*", "vendor*"]

[tool.setuptools.package-data]
vendor = ["vendor/*/LICENSE", "vendor/*/PROVENANCE.md", "vendor/README.md"]
